# ============================================================================
# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# SIMPLIFIED WAF TUNING (Broad API Trust Approach)
#
# Philosophy:
# Instead of micro-managing every single parameter (which breaks constantly as
# the app evolves, custom apps are added, or map data is sent), we trust 
# Frappe's internal ORM (Database layer) and HTML sanitizers to handle 
# SQL Injection (SQLi) and Cross-Site Scripting (XSS) for API routes. 
# 
# The WAF remains active to block structural attacks, bad bots, protocol 
# violations, PHP/Java injections, and attacks against the static front-end.
# ============================================================================

# ------------------------------------------------------------------------------
# 1. Ignore Socket.IO completely
# Safe to disable as it's a websocket upgrade, not standard HTTP traffic.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /socket.io" \
    "id:10001,phase:1,pass,nolog,ctl:ruleEngine=Off"


# ------------------------------------------------------------------------------
# 2. Broadly exempt ALL Frappe APIs from SQLi & XSS checks
# This is the "magic bullet" that stops map data (GeoJSON), rich text, complex 
# filters, and chat messages from being flagged. 
# We disable rules 941xxx (XSS), 942xxx (SQLi), and 932xxx (RCE) for ANY 
# endpoint starting with /api/.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:10002,phase:1,pass,nolog,\
    ctl:ruleRemoveById=941000-942999,\
    ctl:ruleRemoveById=932000-932999"


# ------------------------------------------------------------------------------
# 3. Broadly exempt the Frappe Desk UI (/app)
# The desk UI handles heavy state management in the URL, which triggers 
# injection and path traversal false positives.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /app" \
    "id:10003,phase:1,pass,nolog,\
    ctl:ruleRemoveById=941000-942999,\
    ctl:ruleRemoveById=930000-930999"


# ------------------------------------------------------------------------------
# 4. Stop inspecting ALL Cookies for Injection
# Cookies like `sid` are generated by Frappe and frequently contain base64 
# strings that look like obfuscated attacks.
# ------------------------------------------------------------------------------
SecRuleUpdateTargetById 941000-942999 "!REQUEST_COOKIES"
SecRuleUpdateTargetById 942450 "!REQUEST_COOKIES"


# ------------------------------------------------------------------------------
# 5. File Upload & Static Asset Paths
# We trust Frappe's internal file serving logic to prevent path traversal 
# (e.g., trying to access ../../etc/passwd). We disable rule 930xxx.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /files/" \
    "id:10004,phase:1,pass,nolog,ctl:ruleRemoveById=930000-930999"

SecRule REQUEST_URI "@beginsWith /private/files/" \
    "id:10005,phase:1,pass,nolog,ctl:ruleRemoveById=930000-930999"

SecRule REQUEST_URI "@beginsWith /assets/" \
    "id:10006,phase:1,pass,nolog,ctl:ruleRemoveById=930000-930999"
