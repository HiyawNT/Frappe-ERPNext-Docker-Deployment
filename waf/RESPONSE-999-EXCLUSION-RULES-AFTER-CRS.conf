# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf

# ==============================================================================
# ModSecurity Core Rule Set Exclusions for Frappe & ERPNext (Responses)
# ==============================================================================
# These rules manage how ModSecurity handles outbound responses from Frappe.

# 1. Skip Response Body Inspection for API & App Responses
# Checking large JSON API responses or the SPA source code can cause huge performance 
# hits and sometimes triggers data-leakage false positives.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:20001,phase:3,pass,nolog,ctl:ruleRemoveById=950000-959999"

SecRule REQUEST_URI "@beginsWith /app" \
    "id:20002,phase:3,pass,nolog,ctl:ruleRemoveById=950000-959999"

# 2. Exclusions for little_heroes_service
SecRule REQUEST_URI "@contains little_heroes_service" \
    "id:20003,phase:3,pass,nolog,ctl:ruleRemoveById=950000-959999"

# 3. Allow Large File Downloads & Attachments
# File downloads from Frappe might be flagged if response scanning is partially enabled.
SecRule REQUEST_URI "@beginsWith /files/" \
    "id:20004,phase:3,pass,nolog,ctl:ruleRemoveById=950000-959999"
